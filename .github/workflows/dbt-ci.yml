name: dbt ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brokerage
          POSTGRES_PASSWORD: brokerage
          POSTGRES_DB: brokerage
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U brokerage"
          --health-interval 5s
          --health-retries 20

    env:
      PGPASSWORD: brokerage
      DBT_PROFILES_DIR: ${{ github.workspace }}/transform

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Create source tables
        run: psql -h localhost -U brokerage -d brokerage -v ON_ERROR_STOP=1 -f sql/init/01_schemas.sql

      # small, fixed-seed dataset so CI is fast and repeatable
      - name: Generate source data
        run: |
          python generator/generate.py --random-seed 42 seed --accounts 60 --days 20 --orders-per-day 60
          python generator/generate.py --random-seed 7 tick --orders 30

      - name: dbt build
        working-directory: transform
        run: |
          dbt debug
          dbt source freshness
          dbt build

      # second pass: new activity lands, then the same order Airflow uses.
      # The snapshot has to run first or accounts opened since the last run
      # are missing from dim_accounts and the relationships test fails.
      - name: dbt build again (incremental path)
        working-directory: transform
        run: |
          python ../generator/generate.py tick --orders 30
          dbt snapshot
          dbt build --exclude resource_type:snapshot

      # put failed models/tests on the PR as annotations, so nobody has to
      # scroll through the whole dbt log to find what broke
      - name: Report failures
        if: failure()
        working-directory: transform
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("target/run_results.json")
          if p.exists():
              for r in json.loads(p.read_text())["results"]:
                  if r["status"] not in ("success", "pass", "skipped"):
                      msg = (r.get("message") or "").replace("\n", " ")[:900]
                      print(f"::error title={r['unique_id']}::{r['status']}: {msg}")
          PY
