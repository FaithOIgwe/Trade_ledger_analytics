# Three profiles so you don't need 12 containers running at once:
#
#   docker compose up -d                       -> postgres + airflow (batch path)
#   docker compose --profile lakehouse up -d   -> + minio, iceberg catalog, spark, trino
#   docker compose --profile cdc up -d         -> + redpanda, debezium, clickhouse
#
# Everything talks over the default compose network using service names.

x-minio-creds: &minio-creds
  AWS_ACCESS_KEY_ID: admin
  AWS_SECRET_ACCESS_KEY: password
  AWS_REGION: us-east-1

services:

  # ---------- core ----------

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: brokerage
      POSTGRES_PASSWORD: brokerage
      POSTGRES_DB: brokerage
    # logical replication is needed for Debezium; harmless otherwise
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    ports: ["5432:5432"]
    volumes:
      - ./sql/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brokerage"]
      interval: 5s
      retries: 20

  airflow:
    build: ./orchestration
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      SOURCE_DATABASE_URL: postgresql://brokerage:brokerage@postgres:5432/brokerage
      DBT_HOST: postgres
      DBT_PROFILES_DIR: /opt/project/transform
      # keep dbt's scratch output inside the container, not in the mounted repo
      DBT_TARGET_PATH: /tmp/dbt/target
      DBT_LOG_PATH: /tmp/dbt/logs
      ALPACA_API_KEY: ${ALPACA_API_KEY:-}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY:-}
    command: standalone
    ports: ["8080:8080"]
    volumes:
      - ./orchestration/dags:/opt/airflow/dags
      - ./:/opt/project

  # ---------- lakehouse ----------

  minio:
    profiles: [lakehouse]
    image: minio/minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
      MINIO_DOMAIN: minio
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    networks:
      default:
        aliases: [warehouse.minio]

  minio-init:
    profiles: [lakehouse]
    image: minio/mc
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 admin password; do sleep 1; done;
      mc mb --ignore-existing local/warehouse;
      "

  iceberg-rest:
    profiles: [lakehouse]
    image: tabulario/iceberg-rest
    depends_on: [minio]
    environment:
      <<: *minio-creds
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
    ports: ["8181:8181"]

  spark:
    profiles: [lakehouse]
    image: tabulario/spark-iceberg
    depends_on: [iceberg-rest, minio, postgres]
    environment:
      <<: *minio-creds
    volumes:
      - ./lakehouse/spark:/home/iceberg/jobs
    ports: ["8888:8888"]   # notebook, handy for poking around

  trino:
    profiles: [lakehouse]
    image: trinodb/trino
    depends_on: [iceberg-rest]
    ports: ["8081:8080"]
    volumes:
      - ./lakehouse/trino/catalog/iceberg.properties:/etc/trino/catalog/iceberg.properties:ro
      - ./lakehouse/queries:/queries:ro

  # ---------- cdc ----------

  redpanda:
    profiles: [cdc]
    image: redpandadata/redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --smp 1
      - --memory 1G
      - --mode dev-container
    ports: ["19092:19092"]

  debezium:
    profiles: [cdc]
    image: quay.io/debezium/connect:2.7
    depends_on: [redpanda, postgres]
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      GROUP_ID: debezium
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
    ports: ["8083:8083"]

  clickhouse:
    profiles: [cdc]
    image: clickhouse/clickhouse-server:24.8
    depends_on: [redpanda]
    environment:
      CLICKHOUSE_USER: analyst
      CLICKHOUSE_PASSWORD: analyst
    ports: ["8123:8123"]
    volumes:
      - ./cdc/clickhouse:/sql:ro
    ulimits:
      nofile: {soft: 262144, hard: 262144}

volumes:
  pgdata:
